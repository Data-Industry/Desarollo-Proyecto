name: Despliegue Continuo a GitHub Pages (CI/CD)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permisos requeridos para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garantiza una sola ejecución simultánea de despliegue
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias del Proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pruebas Unitarias de ETL
        run: python -m unittest discover -s src/etl -p "test_*.py"

      - name: Ejecutar Pruebas Unitarias de Pipeline
        run: python -m unittest discover -s src/pipeline -p "test_*.py"

      - name: Ejecutar Pruebas Unitarias de Modelos y Despliegue
        run: python -m unittest discover -s src/models -p "test_*.py"

      - name: Regenerar y Validar Sincronizacion de Artefactos Web
        run: python src/ui/generar_mvp_interactivo.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir Artefacto Web de Pagina
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
